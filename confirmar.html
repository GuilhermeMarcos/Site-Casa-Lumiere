<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Confirmar reserva | Casa Lumière</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2E1F16">
<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
<style>
:root{--walnut:#2E1F16;--ink:#2B1D14;--muted:#5A4636;--line:#D5C3A6;--parch:#F2EADD;--papel:#FBF7F0;--gold-1:#F6DC98;--gold-2:#D4A24E;--gold-3:#A8742F;--bronze:#7A5222;--ok:#2F6B3F;--erro:#8E3B2A}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;background:var(--parch);color:var(--ink);font:400 1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.topo{background:var(--walnut);color:var(--gold-1);display:flex;align-items:center;gap:.6rem;padding:.9rem 1.1rem;padding-top:max(.9rem, env(safe-area-inset-top))}
.topo img{width:30px;height:auto}
.topo span{font-family:Georgia,"Times New Roman",serif;font-size:1.15rem;letter-spacing:.03em}
main{max-width:30rem;margin:0 auto;padding:1.25rem 1rem 3rem}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:1.9rem;line-height:1.15;margin-bottom:.35rem}
h1 em{color:var(--bronze)}
.sub{color:var(--muted);font-size:.95rem;margin-bottom:1.1rem}
.cartao{background:var(--papel);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);padding:1.1rem 1.15rem}
dl{display:grid;grid-template-columns:auto 1fr;gap:.55rem 1rem}
dt{color:var(--muted);font-size:.9rem}
dd{font-weight:600;text-align:right}
dd.valor{font-size:1.25rem}
.selo{display:inline-block;font-size:.8rem;font-weight:700;border-radius:999px;padding:.3em .85em;margin-bottom:.9rem}
.selo.pre{background:#F3E6CC;color:var(--bronze);box-shadow:inset 0 0 0 1px var(--gold-2)}
.selo.ok{background:var(--walnut);color:var(--gold-1)}
.selo.exp{background:#EAE1D2;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:3.4rem;border:0;border-radius:999px;font:700 1.05rem system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.02em;cursor:pointer;text-decoration:none;margin-top:1rem}
.btn.ouro{background:linear-gradient(120deg,var(--gold-1),var(--gold-2) 55%,var(--gold-3));color:#2A1C12;box-shadow:0 8px 22px rgba(168,116,47,.35)}
.btn.linha{background:transparent;color:var(--bronze);box-shadow:inset 0 0 0 1.5px var(--gold-2);min-height:3rem;font-size:.95rem}
.btn.texto{background:none;color:var(--erro);min-height:2.6rem;font-size:.9rem;text-decoration:underline;text-underline-offset:.2em;margin-top:.4rem}
.btn[disabled]{opacity:.6;cursor:progress}
.btn svg{width:1.2em;height:1.2em;fill:currentColor}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.duas .btn{margin-top:.6rem}
.aviso{margin-top:1rem;padding:.8rem .95rem;border-radius:12px;font-size:.92rem}
.aviso.ok{background:#E3EFE3;color:var(--ok);box-shadow:inset 0 0 0 1px #B9D6BC}
.aviso.erro{background:#F6E3DE;color:var(--erro);box-shadow:inset 0 0 0 1px #E2B9AE}
.aviso:empty{display:none}
.rodape{margin-top:1.4rem;text-align:center;font-size:.9rem}
.rodape a{color:var(--bronze)}
label{display:block;font-size:.85rem;font-weight:600;color:var(--bronze);margin:.9rem 0 .3rem}
input[type=email],input[type=password],#cd{width:100%;font:inherit;font-size:1rem;padding:.8rem .9rem;border:0;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--gold-2)}
.lembrar{display:flex;align-items:center;gap:.5rem;font-weight:500;color:var(--ink)}
.lembrar input{width:1.1rem;height:1.1rem;accent-color:var(--gold-3)}
.carregando{display:flex;gap:.5rem;align-items:center;color:var(--muted);padding:2rem 0}
.carregando i{width:.6rem;height:.6rem;border-radius:50%;background:var(--gold-2);animation:p 1s infinite ease-in-out}
.carregando i:nth-child(2){animation-delay:.15s}.carregando i:nth-child(3){animation-delay:.3s}
@keyframes p{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:none}}
[hidden]{display:none !important}
</style>
<script src="js/confirmar.js" defer></script>
</head>
<body>
<header class="topo"><img src="assets/img/monograma-96.webp" width="30" height="28" alt=""><span>Casa Lumière</span></header>
<main id="tela" aria-live="polite">
  <div class="carregando" role="status"><i></i><i></i><i></i> Carregando a reserva…</div>
</main>
</body>
</html>
